[extend]
useDefault = true

[[rules]]
id = "twohelixes-api-key"
description = "TwoHelixes API key"
regex = '''sk-th-[A-Za-z0-9_-]{24,}'''
secretGroup = 0
entropy = 3.5

[[allowlists]]
description = "Public school directory fixtures: sha256 manifest hashes beside names like Larrakeyah"
paths = ['''interp/twohelixes/datasets/fixtures/world_schools/.*\.json''']
