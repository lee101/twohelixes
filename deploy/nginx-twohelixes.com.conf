# twohelixes.com -> the twoHelixes Mojo server on 127.0.0.1:7474
#
# Two things here differ from the other app.nz sites and both matter:
#
#  * /v1/*/stream is Server-Sent Events. nginx must not buffer or gzip it, or
#    the reasoning trace arrives in one lump at the end and the product's whole
#    point is lost.
#  * Connection is set from a map rather than hard-coded to "upgrade". Sending
#    `Connection: upgrade` on ordinary requests breaks upstream keepalive, and
#    this app has no websockets at all.

map $http_upgrade $twohelixes_connection {
    default upgrade;
    ''      '';
}

upstream twohelixes_backend {
    server 127.0.0.1:7474;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name twohelixes.com www.twohelixes.com;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name twohelixes.com www.twohelixes.com;

    ssl_certificate     /etc/letsencrypt/live/twohelixes.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twohelixes.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    client_max_body_size 200M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # The built frontend bundle. Served by nginx so a static asset never
    # occupies a worker's embedded Python interpreter.
    location /static/ {
        alias /nvme0n1-disk/code/twohelixes/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
    }

    # Server-Sent Events: stream through untouched.
    location ~ ^/v1/.*/stream$ {
        proxy_pass http://twohelixes_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1800s;
    }

    location / {
        proxy_pass http://twohelixes_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $twohelixes_connection;

        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
